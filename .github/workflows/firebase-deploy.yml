name: Deploy to Firebase Hosting

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install main app dependencies
        run: npm ci

      - name: Install admin app dependencies
        run: npm ci
        working-directory: admin

      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      - name: Ensure Firebase project exists
        run: |
          firebase projects:create looks-saloon --display-name "Looks Saloon" --token "$FIREBASE_TOKEN" || echo "Project already exists, continuing."
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}

      - name: Ensure Firestore database exists
        run: |
          firebase firestore:databases:create "(default)" --location=nam5 --project looks-saloon --token "$FIREBASE_TOKEN" || echo "Firestore database already exists, continuing."
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}

      - name: Ensure admin Hosting site exists
        run: |
          firebase hosting:sites:create looks-saloon-admin --project looks-saloon --token "$FIREBASE_TOKEN" || echo "Hosting site already exists, continuing."
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}

      - name: Ensure Web App exists and fetch SDK config
        run: |
          set -e
          LIST_JSON=$(firebase apps:list WEB --project looks-saloon --token "$FIREBASE_TOKEN" --json)
          echo "$LIST_JSON"
          APP_ID=$(echo "$LIST_JSON" | jq -r '.result[0].appId // empty')
          if [ -z "$APP_ID" ]; then
            CREATE_JSON=$(firebase apps:create WEB "Looks Saloon Web" --project looks-saloon --token "$FIREBASE_TOKEN" --json)
            echo "$CREATE_JSON"
            APP_ID=$(echo "$CREATE_JSON" | jq -r '.result.appId')
          fi
          echo "Using web app: $APP_ID"

          CONFIG_JSON=$(firebase apps:sdkconfig WEB "$APP_ID" --project looks-saloon --token "$FIREBASE_TOKEN" --json)
          {
            echo "VITE_FIREBASE_API_KEY=$(echo "$CONFIG_JSON" | jq -r '.result.sdkConfig.apiKey')"
            echo "VITE_FIREBASE_AUTH_DOMAIN=$(echo "$CONFIG_JSON" | jq -r '.result.sdkConfig.authDomain')"
            echo "VITE_FIREBASE_PROJECT_ID=$(echo "$CONFIG_JSON" | jq -r '.result.sdkConfig.projectId')"
            echo "VITE_FIREBASE_STORAGE_BUCKET=$(echo "$CONFIG_JSON" | jq -r '.result.sdkConfig.storageBucket')"
            echo "VITE_FIREBASE_MESSAGING_SENDER_ID=$(echo "$CONFIG_JSON" | jq -r '.result.sdkConfig.messagingSenderId')"
            echo "VITE_FIREBASE_APP_ID=$(echo "$CONFIG_JSON" | jq -r '.result.sdkConfig.appId')"
          } > .env.firebase

          cp .env.firebase .env.production
          cp .env.firebase admin/.env.production

          echo "API_KEY=$(echo "$CONFIG_JSON" | jq -r '.result.sdkConfig.apiKey')" >> "$GITHUB_ENV"
          echo "PROJECT_ID=looks-saloon" >> "$GITHUB_ENV"
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}

      - name: Build main site
        run: npm run build

      - name: Build admin dashboard
        run: npm run build
        working-directory: admin

      - name: Deploy Hosting and Firestore rules
        run: firebase deploy --only hosting:main,hosting:admin,firestore:rules --project looks-saloon --token "$FIREBASE_TOKEN" --non-interactive
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}

      - name: Deploy Storage rules
        run: |
          firebase deploy --only storage --project looks-saloon --token "$FIREBASE_TOKEN" --non-interactive || \
            echo "Storage rules deploy failed (Cloud Storage may not be enabled for this project yet) - continuing."
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
